# Configuracion del ambiente. La contrasena NO va aqui:
# se pasa como variable de entorno AMEX_CONTRASENA o con -Damex.contrasena=...
amex.url=https://qaeapplyargpf.firmaautografa.com/es-ar/business/consumer/eapply/expediente/
amex.usuario=admin-centurion@na-at.com

# chrome | firefox | edge
amex.navegador=chrome
# true = sin ventana (para CI); false = para ver la ejecucion
amex.headless=true
# Espera maxima en segundos para que aparezca un elemento
amex.espera=20

# Catalogos que debe mostrar la lista desplegable de la pantalla Catalogos,
# segun PF_CP_046. Si en el ambiente cambia un nombre o se agrega/quita un
# catalogo, se ajusta AQUI (no en el codigo): si un catalogo no aparece, el
# caso falla indicando cuales muestra hoy la aplicacion.
amex.catalogos=Nacionalidades,Profesiones,Campaña,Codigo de pais,Productos,Dias festivos,Versiones

# Columnas que debe mostrar la tabla de la pantalla Inicio, segun PF_CP_009.
# Si negocio cambia el nombre de una columna, se ajusta AQUI (no en el codigo).
amex.inicio.columnas=Referencia,Fecha y hr. inicio,Fecha y hr. fin,Rol,Cliente,Usuario Modificó,Estatus

# Estatus que debe mostrar la grafica de Inicio con su cantidad y su porcentaje,
# segun PF_CP_008. La matriz los nombra en plural (Aprobadas, Denegadas,
# Creadas) y la aplicacion en singular: aqui se usa el nombre de la aplicacion.
amex.inicio.estatus=Aprobada,Denegada,Creado,Condicionada a ingresos,Ingreso,Aviso de privacidad,Identificación oficial,Validación de identidad,Términos y condiciones,Pendiente de firma,Por dictaminar,Cancelado

# Botones que debe mostrar la pantalla de Usuarios, segun PF_CP_010.
amex.usuarios.botones=AGREGAR USUARIO,CARGA MASIVA DE USUARIOS,Actualizar tabla,Exportar a excel,Filtrar

# Ola 2 - listas del formulario Agregar usuario (PF_CP_012 y PF_CP_013). Las
# opciones DEPENDEN DEL PERFIL con el que se ejecuta: con admin-centurion el
# area es CENTURION y con otros perfiles puede ser Ventas. Por eso hay dos
# formas de declararlas:
#   1) la lista general (se usa cuando no hay una lista para el usuario)
#   2) una lista por usuario: amex.usuario.areas.CORREO (gana sobre la general)
# Tambien se puede sobreescribir en la corrida:
#   mvn test -Dtest='UsuariosValidacionesPruebas#pfCp012ListaArea' \
#       -Damex.usuario=otro@na-at.com -Damex.usuario.areas=Ventas
# La matriz documenta area "Ventas" y 5 tipos de usuario: esa diferencia sigue
# pendiente de confirmar con negocio (ver README seccion 7.1).
amex.usuario.areas=CENTURION
amex.usuario.tipos=Administrador Centurion,Usuario Centurion

amex.usuario.areas.admin-centurion@na-at.com=CENTURION
amex.usuario.tipos.admin-centurion@na-at.com=Administrador Centurion,Usuario Centurion
amex.usuario.areas.admin@na-at.com=VENTAS
# Este perfil es el que describe la matriz (area VENTAS y 5 tipos de usuario).
amex.usuario.tipos.admin@na-at.com=Administrador Apex,Supervisor AXP,Usuario AXP,Supervisor Agencia,Usuario Agencia

# ---------------------------------------------------------------- Ola 4
# Columnas que la matriz espera en cada archivo descargado. El caso verifica que
# TODAS esten en el archivo (si el archivo trae columnas extra no falla, las
# informa en el mensaje). Si negocio cambia el layout, se ajusta AQUI.
amex.excel.usuarios=Número de empleado,Nombre,Apellidos,Correo electrónico,Rol,Estatus,Campañas
# PF_CP_022: la matriz pide Teléfono móvil y Teléfono Fijo; el layout de QA repite
# "Teléfono móvil" en las dos columnas (DEF_03, ver README seccion 7.1).
amex.excel.layout.usuarios=Nombre,Apellido,Email,Número de empleado,Cargo,Código de país,Teléfono móvil,Teléfono Fijo,Rol,Campaña(s)
amex.excel.layout.usuarios.hojas=Layout,Roles,Campañas
# PF_CP_127: la matriz pide Id_Solicitud como primera columna; QA no la exporta.
amex.excel.solicitudes=Id_Solicitud,Referencia,Nombre,Apellido(s),DNI,Producto,Fecha creación,Fecha modificación,Campaña,Creada por,Estatus
# PF_CP_154: la matriz pide Id como primera columna; QA no la exporta.
amex.excel.reporte.general=Id,Referencia,Nombre,Apellidos,DNI,Estatus de la solicitud,Fecha Creación,Fecha modificación,Producto,Campaña,Geolocalización,Resultado de biometría,Porcentaje de coincidencia,Dispositivo usado,Sistema operativo,Sujeto obligado,P.E.P.,P.E.P.(cargo / función / jerarquía),Creado por
amex.excel.reporte.url=Id,Referencia,Fecha Creación,Creado por,Key Url,Fecha expiración,Estatus Url
amex.excel.reporte.url.totales=Total de Urls creadas
amex.excel.reporte.whatsapp=Campaña,Referencia,DNI,Plantilla,Fecha envio,Teléfono origen,Télefono destino,Enviado,Respuesta API,Fecha Epiron,Resultado Epiron
amex.excel.reporte.whatsapp.totales=Total de mensajes WhatsApp enviados

# Documentos que debe traer el ZIP de una solicitud firmada (PF_CP_142) y el ZIP
# Griffin (PF_CP_143).
amex.zip.expediente=identity_validation.pdf,signed_pdf.pdf,selfie.jpg,official_id_front.png,official_id_back.png
amex.zip.griffin=identity_validation.pdf,signed_pdf.pdf

# Rango de fechas que usan los reportes que exigen fecha (totales URL y WhatsApp).
# Se elige con el calendario: dia 1 del mes indicado.
amex.reportes.anio.inicio=2025
amex.reportes.mes.inicio=ENE
amex.reportes.anio.fin=2025
amex.reportes.mes.fin=JUL
# DNI que no existe en el ambiente, para el reporte sin resultados (PF_CP_155).
amex.reportes.dni.inexistente=00000000

# ---------------------------------------------------------------- Ola 5
# Datos que CREAN o MODIFICAN registros en el ambiente (grupo escribe_datos).
# Todo lo que la automatizacion da de alta lleva este prefijo, para reconocerlo en
# las pantallas y para poder limpiarlo. Si se cambia, cambia solo la etiqueta.
amex.datos.prefijo=ZZAUTOQA
# Dominio del correo de los usuarios que crea la automatizacion (no recibe correo
# real: solo tiene que ser un correo valido y distinto en cada ejecucion).
amex.datos.correo=na-at.com
# Tipo de usuario y codigo de pais con los que se da de alta el usuario de prueba.
amex.datos.usuario.tipo=Usuario Centurion
amex.datos.usuario.codigo.pais=+549
# Dia festivo de prueba: se elige con el calendario un anio lejano para no chocar
# con los dias festivos reales del ambiente.
amex.datos.anio=2031
amex.datos.mes=DIC

#Prueba de merge

# ---------------------------------------------------------------- Ola 6
# Pestanas del detalle de una solicitud, en el orden en que las muestra la
# pantalla. Los casos PF_CP_130 a PF_CP_141 verifican, para cada estatus, cuales
# deben estar HABILITADAS: las que no se listen deben estar deshabilitadas.
# Si negocio cambia la regla de un estatus, se ajusta AQUI (no en el codigo).
amex.expediente.pestanas=DNI,Firma,Carátula,RENAPER,Devolver,Dictaminar
amex.expediente.PF_CP_130.estatus=Creado
amex.expediente.PF_CP_130.habilitadas=DNI
amex.expediente.PF_CP_131.estatus=Ingreso
amex.expediente.PF_CP_131.habilitadas=DNI
amex.expediente.PF_CP_132.estatus=Aviso de privacidad
amex.expediente.PF_CP_132.habilitadas=DNI
amex.expediente.PF_CP_133.estatus=Identificación oficial
amex.expediente.PF_CP_133.habilitadas=DNI
amex.expediente.PF_CP_134.estatus=Validación de identidad
amex.expediente.PF_CP_134.habilitadas=DNI
amex.expediente.PF_CP_135.estatus=Terminos y condiciones
amex.expediente.PF_CP_135.habilitadas=DNI
amex.expediente.PF_CP_136.estatus=Pendiente de firma
amex.expediente.PF_CP_136.habilitadas=DNI,Firma,Carátula,RENAPER,Devolver
amex.expediente.PF_CP_137.estatus=Firmada
amex.expediente.PF_CP_137.habilitadas=DNI,RENAPER,Devolver
amex.expediente.PF_CP_138.estatus=Por dictaminar
amex.expediente.PF_CP_138.habilitadas=DNI,Firma,Carátula,RENAPER,Devolver,Dictaminar
amex.expediente.PF_CP_139.estatus=Denegada
amex.expediente.PF_CP_139.habilitadas=DNI,Firma,Carátula,RENAPER,Devolver,Dictaminar
amex.expediente.PF_CP_140.estatus=Aprobada
amex.expediente.PF_CP_140.habilitadas=DNI,Firma,Carátula,RENAPER,Devolver,Dictaminar
amex.expediente.PF_CP_141.estatus=Cancelado por datos erróneos
amex.expediente.PF_CP_141.habilitadas=DNI
# Estatus con el que se prueban los botones masivos Aprobar/Denegar solicitudes
# (PF_CP_144 y PF_CP_145). El caso NUNCA confirma el popup: solo lo valida.
amex.expediente.estatus.dictaminar=Por dictaminar
# Documentos que debe traer el ZIP de Doc. Griffin del detalle (PF_CP_146).
amex.zip.griffin.detalle=identity_validation.pdf,signed_pdf.pdf
# Producto y periodo con los que se revisa el popup de costos (PF_CP_149 y 150).
# El caso NUNCA guarda: solo valida los campos del popup y lo cierra con Cancelar.
amex.costos.anio=2026
amex.costos.mes=Agosto