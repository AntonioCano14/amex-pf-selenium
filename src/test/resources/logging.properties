# Silencia los avisos de Selenium sobre la version de CDP del navegador
# (no afectan la ejecucion) y deja solo los errores reales.
handlers=java.util.logging.ConsoleHandler
.level=INFO
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
org.openqa.selenium.level=SEVERE
org.openqa.selenium.devtools.level=SEVERE
org.openqa.selenium.devtools.CdpVersionFinder.level=SEVERE
org.openqa.selenium.chromium.level=SEVERE
org.openqa.selenium.chromium.ChromiumDriver.level=SEVERE
